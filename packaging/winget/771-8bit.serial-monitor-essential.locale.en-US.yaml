ShortDescription: Fast serial monitor and plotter for embedded development
Description: >-
  A serial monitor for embedded development that keeps up at high baud rates without
  dropping bytes or freezing the UI. Received data is spilled to disk so memory stays
  flat during long captures, and the built-in plotter charts numeric channels in real
  time with min/max bands preserved through downsampling.

