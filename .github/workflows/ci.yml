# リリースゲート Tier 1（docs/25_release_strategy.md §3.2）。
# docs/24_vv_plan.md §9.1 の必須ゲート 7 項目をすべてここで通す。
#
# E2E（com0com + UIA）・ペアワイズ・ミューテーション・メモリソーク・実機 Pico は
# Tier 2（開発機で手動〜半自動）で実施する。ホストランナーでは
# com0com のカーネルモードドライバを入れられず、UI Automation に必要な
# 対話的デスクトップセッションも無いため、CI では回さない。詳細は docs/25 §3.4。
#
# ジョブは windows-latest と ubuntu-22.04 の 2 本（どちらも正式サポート対象 OS）。
# 両者は依存関係を持たせず並列に走らせる。macOS を含む 3 OS マトリクスは
# 引き続き rust-ci.yml（週次の定点観測）が担当する。
# windows-latest には WebView2 が同梱されているため、Tauri のビルド依存は追加不要。
# ubuntu 側は WebKitGTK 一式を apt で入れる（後述 Install Linux dependencies）。
# cargo test はバンドルを作らないので tauri CLI も要らない。

name: CI

on:
  push:
    branches: [dev, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # 以降は「速く落ちるものから順」に並べる（fast-fail）。
      - name: Type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint .

      - name: Prettier
        run: npx prettier --check "src/**/*.{ts,tsx,css}" "*.{json,js,ts}"

      - name: Vitest
        run: npx vitest run

      - name: Frontend production build
        run: npm run build

      - name: Rust format
        run: cargo fmt -- --check
        working-directory: src-tauri

      - name: Rust clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      # 単体 + プロパティ（8 件）+ 状態遷移 0-switch / 1-switch（49 順序対）。
      - name: Rust tests
        run: cargo test
        working-directory: src-tauri

  # Linux（Ubuntu 22.04+ x64）正式サポートに伴うバックエンド検査。
  # test ジョブとは needs で繋がず並列に走らせる（両方の結果を 1 回の push で得る）。
  test-linux:
    name: Test (ubuntu-22.04)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Tauri 2 の Linux ビルド依存一式。libudev-dev は serialport クレートが
      # ポート列挙に使う libudev-sys のリンクに必須（無いと pkg-config で落ちる）。
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libudev-dev build-essential pkg-config libssl-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # rust-cache は OS/arch を自動で鍵に含めるが、release.yml の Linux ジョブとは
      # 用途が違うので key を明示して分離しておく。
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux-ci
          prefix-key: v0-rust-linux

      # フロントエンド検査（tsc / eslint / prettier / vitest）は OS 非依存なので windows ジョブのみで走らせ、ここでは重複させない。
      - name: Rust clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Rust tests
        run: cargo test
        working-directory: src-tauri
