# タグ push（v*）で Windows インストーラ（NSIS / MSI）と
# Linux パッケージ（.deb / .AppImage）をビルドし、
# GitHub Release を **draft** で作成する。
#
# build / build-linux は並列に走り、同一タグの同一 draft release に添付する。
# softprops/action-gh-release はタグ単位で冪等（既存 release があれば作らず添付するだけ）
# なので、両ジョブを needs で直列化する必要はない。ただし draft: true など
# release 側のパラメータは 2 ジョブで必ず一致させること。
#
# publish は手動で行う。docs/25_release_strategy.md §4 手順 8 の
# 「パッケージ版での手動スモーク」（インストール → 起動 → COM 接続 → プロッタ描画 → exit 0）が
# 通ったときだけ publish する。draft の間は利用者から見えない。
#
# コード署名は行っていない（docs/25 §6 R-1 / TBD-RS4）。
# インストーラ実行時に SmartScreen の警告が出ることを Release 本文に明記すること。

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build installers and draft release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # bundle.targets = "all" のため、Windows では NSIS(.exe) と MSI(.msi) の両方が
      # src-tauri/target/release/bundle/ 配下に生成される。
      - name: Build Tauri app
        run: npm run tauri build

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  build-linux:
    name: Build Linux packages and draft release
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Tauri 2 の Linux ビルド依存一式。libudev-dev は serialport クレートが
      # ポート列挙に使う libudev-sys のリンクに必須（無いと pkg-config で落ちる）。
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libudev-dev build-essential pkg-config libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # ci.yml の Linux ジョブとはキャッシュを分ける（あちらは test/clippy、
      # こちらは release プロファイルのフルビルドで中身が別物）。
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux-release
          prefix-key: v0-rust-linux-release

      - name: Install dependencies
        run: npm ci

      # bundle.targets = "all" だと rpm 等も走るため、Linux では deb と appimage に絞る。
      # AppImage の生成では linuxdeploy を実行時にダウンロードして使う。GitHub ランナー上では
      # そのまま通るが、strip 段でバンドル済みライブラリが壊れて落ちることがあるので
      # 予防的に NO_STRIP=true を渡しておく（バイナリサイズが少し増えるだけ）。
      - name: Build Tauri app
        env:
          NO_STRIP: 'true'
        run: npm run tauri build -- --bundles deb,appimage

      # windows 側と同一パラメータ（draft: true / generate_release_notes / fail_on_unmatched_files）で
      # 同じタグの draft release に添付する。
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
